name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run tests
        run: php artisan test

      - name: Measure test coverage
        run: vendor/bin/phpunit --coverage-text=coverage.txt --colors=never

      - name: Generate coverage badge image
        run: |
          PERCENT=$(grep -m1 "Lines:" coverage.txt | grep -oE "[0-9]+\.[0-9]+" | head -1)
          COLOR=$(awk -v p="$PERCENT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
          mkdir -p .github/badges
          curl -sf "https://img.shields.io/badge/coverage-${PERCENT}%25-${COLOR}" -o .github/badges/coverage.svg
          cat .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
